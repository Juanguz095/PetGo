  <line x1="40" y1="1680" x2="1160" y2="1680" class="line"/>

  <!-- 08 FAQ -->
  <text x="80" y="1712" class="lab">08 · FAQ</text>
  <text x="80" y="1748" class="t18">Título</text>
  <text x="80" y="1770" class="t10">contacto</text>

  <text x="560" y="1738" class="t13">Pregunta 1</text>
  <text x="1100" y="1738" class="t11" text-anchor="end">+</text>
  <line x1="560" y1="1752" x2="1120" y2="1752" class="soft"/>
  <text x="560" y="1776" class="t13">Pregunta 2</text>
  <text x="1100" y="1776" class="t11" text-anchor="end">+</text>
  <line x1="560" y1="1790" x2="1120" y2="1790" class="soft"/>
  <text x="560" y="1814" class="t13">Pregunta 3</text>
  <text x="1100" y="1814" class="t11" text-anchor="end">+</text>
  <line x1="560" y1="1828" x2="1120" y2="1828" class="soft"/>
  <text x="560" y="1852" class="t13">Pregunta 4</text>
  <text x="1100" y="1852" class="t11" text-anchor="end">+</text>
  <line x1="560" y1="1866" x2="1120" y2="1866" class="soft"/>
  <text x="560" y="1890" class="t13">Pregunta 5</text>
  <text x="1100" y="1890" class="t11" text-anchor="end">+</text>
  <line x1="40" y1="1924" x2="1160" y2="1924" class="line"/>

  <!-- 09 DESCARGA -->
  <text x="80" y="1956" class="lab">09 · DESCARGA</text>
  <text x="80" y="1992" class="t13">3 pasos</text>
  <text x="80" y="2012" class="t10">requisitos</text>
  <rect x="640" y="1968" width="480" height="86" class="comp"/>
  <text x="880" y="2016" class="t11 ctr">botón + QR + versión</text>
  <line x1="40" y1="2074" x2="1160" y2="2074" class="line"/>

  <!-- 10 FOOTER -->
  <text x="80" y="2100" class="lab">10 · FOOTER</text>
  <text x="80" y="2128" class="t11">columna 1</text>
  <text x="360" y="2128" class="t11">columna 2</text>
  <text x="640" y="2128" class="t11">columna 3</text>
  <text x="920" y="2128" class="t11">columna 4</text>
</svg>

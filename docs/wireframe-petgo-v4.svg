  <text x="80" y="1194" class="lab">05 · CAPTURAS</text>
  <rect x="80" y="1212" width="196" height="104" class="ph"/>
  <text x="178" y="1268" class="t10 ctr">captura 1</text>
  <rect x="288" y="1212" width="196" height="104" class="ph"/>
  <text x="386" y="1268" class="t10 ctr">captura 2</text>
  <rect x="496" y="1212" width="196" height="104" class="ph"/>
  <text x="594" y="1268" class="t10 ctr">captura 3</text>
  <rect x="704" y="1212" width="196" height="104" class="ph"/>
  <text x="802" y="1268" class="t10 ctr">captura 4</text>
  <rect x="912" y="1212" width="196" height="104" class="ph"/>
  <text x="1010" y="1268" class="t10 ctr">captura 5</text>
  <line x1="40" y1="1344" x2="1160" y2="1344" class="line"/>

  <!-- 06 COMPARTIR -->
  <text x="80" y="1376" class="lab">06 · COMPARTIR</text>

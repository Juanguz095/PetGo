<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200" font-family="'Segoe UI', Arial, sans-serif">
  <style>
    .pg { fill: #ffffff; stroke: #bdbdbd; }
    .ph { fill: #f4f4f4; stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .comp { fill: #ffffff; stroke: #7a7a7a; stroke-width: 1.2; }
    .band { fill: #ededed; }
    .line { stroke: #111111; stroke-width: 1.2; }
    .soft { stroke: #d6d6d6; stroke-width: 1; }
    .lab { font-size: 12px; letter-spacing: 1.5px; fill: #777777; font-weight: 700; }
    .t10 { font-size: 10px; fill: #888888; }
    .t11 { font-size: 11px; fill: #555555; }
    .t13 { font-size: 13px; fill: #111111; }
    .t18 { font-size: 18px; fill: #111111; font-weight: 600; }
    .t24 { font-size: 24px; fill: #111111; font-weight: 600; }
    .ctr { text-anchor: middle; }
  </style>

  <rect width="1200" height="2200" fill="#ffffff"/>
  <text x="40" y="30" class="t18">PetGo · estructura de la landing</text>
  <text x="40" y="50" class="t10">Las diez secciones acordadas. Solo cajas y etiquetas.</text>

  <rect x="40" y="68" width="1120" height="2090" class="pg"/>

  <!-- 01 HERO -->
  <text x="80" y="104" class="lab">01 · HERO</text>
  <text x="80" y="152" class="t24">Título (H1)</text>
  <text x="80" y="172" class="t10">2 líneas</text>
  <text x="80" y="212" class="t13">Subtítulo</text>
  <text x="80" y="230" class="t10">2 líneas</text>
  <rect x="80" y="252" width="170" height="42" class="comp"/>
  <text x="165" y="278" class="t11 ctr">Botón principal</text>
  <text x="266" y="278" class="t11">enlace secundario</text>
  <text x="80" y="322" class="t11">microcopy</text>

  <rect x="640" y="100" width="480" height="300" class="ph"/>
  <text x="880" y="242" class="t11 ctr">imagen / capturas</text>
  <text x="880" y="262" class="t10 ctr">7/12</text>
  <line x1="40" y1="424" x2="1160" y2="424" class="line"/>

  <!-- 02 PROBLEMA -->
  <text x="80" y="456" class="lab">02 · PROBLEMA</text>
  <rect x="240" y="476" width="720" height="76" class="comp"/>
  <text x="600" y="508" class="t13 ctr">Título + 2 párrafos</text>
  <text x="600" y="530" class="t10 ctr">ancho máximo 720 px</text>
  <line x1="40" y1="580" x2="1160" y2="580" class="line"/>

  <!-- 03 QUE PUEDES HACER -->
  <text x="80" y="612" class="lab">03 · QUÉ PUEDES HACER</text>

  <rect x="80" y="632" width="330" height="86" class="comp"/>
  <text x="96" y="666" class="t13">Tarjeta 1</text>
  <text x="96" y="688" class="t10">icono · título · 1 línea</text>

  <rect x="420" y="632" width="330" height="86" class="comp"/>
  <text x="436" y="666" class="t13">Tarjeta 2</text>
  <text x="436" y="688" class="t10">icono · título · 1 línea</text>

  <rect x="760" y="632" width="330" height="86" class="comp"/>
  <text x="776" y="666" class="t13">Tarjeta 3</text>
  <text x="776" y="688" class="t10">icono · título · 1 línea</text>

  <rect x="250" y="730" width="330" height="86" class="comp"/>
  <text x="266" y="764" class="t13">Tarjeta 4</text>
  <text x="266" y="786" class="t10">icono · título · 1 línea</text>

  <rect x="590" y="730" width="330" height="86" class="comp"/>
  <text x="606" y="764" class="t13">Tarjeta 5</text>
  <text x="606" y="786" class="t10">icono · título · 1 línea</text>

  <text x="140" y="940" class="t10">texto · 2 líneas</text>
  <rect x="800" y="892" width="320" height="66" class="ph"/>
  <text x="960" y="930" class="t10 ctr">captura</text>
  <line x1="80" y1="974" x2="1120" y2="974" class="soft"/>

  <text x="80" y="1012" class="t24">2</text>
  <text x="140" y="1010" class="t13">Paso 2</text>
  <text x="140" y="1030" class="t10">texto · 2 líneas</text>
  <rect x="800" y="982" width="320" height="66" class="ph"/>
  <text x="960" y="1020" class="t10 ctr">captura</text>
  <line x1="80" y1="1064" x2="1120" y2="1064" class="soft"/>

  <text x="80" y="1102" class="t24">3</text>
  <text x="140" y="1100" class="t13">Paso 3</text>
  <text x="140" y="1120" class="t10">texto · 2 líneas</text>
  <rect x="800" y="1072" width="320" height="66" class="ph"/>
  <text x="960" y="1110" class="t10 ctr">captura</text>
  <line x1="40" y1="1162" x2="1160" y2="1162" class="line"/>

